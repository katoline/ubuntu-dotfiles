name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nix を準備
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # 事故防止テストはリポジトリが許可された開発ルート配下にある前提で動く。
      - name: テスト用の開発ルートを準備
        run: |
          mkdir -p "$HOME/Dev/hobby"
          cp -a "$GITHUB_WORKSPACE" "$HOME/Dev/hobby/ubuntu-dotfiles"
          echo "DOTFILES_TEST_ROOT=$HOME/Dev/hobby/ubuntu-dotfiles" >> "$GITHUB_ENV"

      # AGENTS.md の設定・フック・共通指示の検証。
      - name: 設定とフックのテスト
        working-directory: ${{ env.DOTFILES_TEST_ROOT }}
        run: bash .claude/tests/run.sh

      # インストールや配布は行わず、シェルの構文だけを確認する。
      - name: シェル構文を検証
        run: |
          bash -n bootstrap.sh
          bash -n opencode/setup.sh
          bash -n zsh/.zshrc

      # home-manager switch は実行せず、宣言設定を評価する。
      - name: Nix の設定を評価
        run: nix eval --raw .#homeConfigurations.ubuntu.activationPackage.drvPath

      - name: Node.js を準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # lockfileVersion 9.0 に対応する固定版を CI 内だけに導入する。
      - name: pnpm を準備
        run: npm install -g pnpm@10.32.1

      - name: claude-notify の依存を取得
        working-directory: claude-notify
        run: pnpm install --frozen-lockfile

      # AGENTS.md の claude-notify 検証。
      - name: claude-notify を Biome で検証
        working-directory: claude-notify
        run: pnpm lint
