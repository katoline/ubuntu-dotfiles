name: Request Dependabot Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR のコードはチェックアウトせず、メタデータだけを使う。
      - name: Request review from seino914
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh api --method POST
          "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers"
          -f "reviewers[]=seino914"
